services:
  web:
    build:
      context: ./ApparkaTrainingFlowOnline
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_CONNECTION: Host=db;Port=5432;Database=apparka_training;Username=apparka;Password=ChangeThisPassword
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apparka_training
      POSTGRES_USER: apparka
      POSTGRES_PASSWORD: ChangeThisPassword
    volumes:
      - apparka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apparka -d apparka_training"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  apparka_pgdata:
